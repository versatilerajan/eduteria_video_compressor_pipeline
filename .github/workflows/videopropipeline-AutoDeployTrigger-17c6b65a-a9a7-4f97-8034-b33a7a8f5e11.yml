name: Trigger auto deployment for videopropipeline

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '.github/workflows/videopropipeline-AutoDeployTrigger-17c6b65a-a9a7-4f97-8034-b33a7a8f5e11.yml'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}

          registryUrl: videopropipeline.azurecr.io
          registryUsername: ${{ secrets.VIDEOPROPIPELINE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.VIDEOPROPIPELINE_REGISTRY_PASSWORD }}

          containerAppName: videopropipeline
          resourceGroup: Anurit_RG

          imageToBuild: videopropipeline.azurecr.io/videopropipeline:${{ github.sha }}
