services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: video-pipeline:latest
    container_name: video-pipeline-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: video-pipeline:latest
    container_name: video-pipeline-worker
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
    command: ["python", "-m", "app.workers.worker"]
    restart: unless-stopped
    depends_on:
      - api
